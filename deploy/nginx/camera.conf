# Install as /etc/nginx/sites-available/camera and enable it in sites-enabled.
# Cloudflare Tunnel connects only to this loopback listener.
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name _;

    root /var/www/camera;
    index index.html;

    # The URI is preserved: /api/login reaches Express as /api/login.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
